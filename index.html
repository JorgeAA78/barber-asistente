<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vigor Barber - Salta Capital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        body.modal-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            background-color: #000;
            border-bottom: 3px solid #D4AF37;
            padding: 24px 16px;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: #D4AF37;
            text-transform: uppercase;
            margin: 0;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5rem;
                letter-spacing: 1px;
            }
        }

        header p {
            color: #aaa;
            margin: 4px 0 0;
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .divider {
            border-top: 1px solid #D4AF37;
            opacity: 0.4;
            margin: 0 auto;
            width: 60px;
        }

        .info-section {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .info-section h2 {
            font-size: 1rem;
            letter-spacing: 3px;
            color: #D4AF37;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .info-section p {
            color: #ccc;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-top: 24px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .services-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 480px) {
            .services-grid {
                grid-template-columns: 1fr;
                gap: 12px;
                max-width: 100%;
            }
        }

        .service-item {
            background: linear-gradient(135deg, #1a1a1a 0%, #252525 100%);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px 16px;
            font-size: 0.95rem;
            color: #eee;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .service-item:hover {
            transform: translateY(-4px);
            border-color: #D4AF37;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.2);
        }

        @media (max-width: 768px) {
            .service-item {
                padding: 18px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 480px) {
            .service-item {
                padding: 16px 12px;
                font-size: 0.85rem;
            }
        }

        .service-item span {
            display: block;
            color: #D4AF37;
            font-weight: bold;
            margin-top: 8px;
            font-size: 1.1rem;
        }

        @media (max-width: 480px) {
            .service-item span {
                font-size: 1rem;
            }
        }

        footer {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            padding: 24px;
            border-top: 1px solid #222;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .info-section {
                padding: 0 16px;
            }
        }

        @media (max-width: 480px) {
            .info-section h2 {
                font-size: 0.9rem;
                letter-spacing: 2px;
            }

            .info-section p {
                font-size: 0.9rem;
            }
        }

        /* ----- Personalización del widget de n8n ----- */
        :root {
            --chat--color-primary: #D4AF37;
            --chat--color-primary-shade-50: #b8971f;
            --chat--color-primary-shade-100: #a07f10;
            --chat--color-secondary: #111;
            --chat--color-secondary-shade-50: #1a1a1a;
            --chat--color-white: #ffffff;
            --chat--color-light: #f9f9f9;
            --chat--color-medium: #d2d4d9;
            --chat--color-dark: #101330;
            --chat--color-disabled: #777;
            --chat--color-typing: #404040;
            --chat--header--color: #ffffff;
            --chat--header--background: #000000;
            --chat--message--bot--background: #1a1a1a;
            --chat--message--bot--color: #eeeeee;
            --chat--message--user--background: #D4AF37;
            --chat--message--user--color: #000000;
            --chat--toggle--background: #D4AF37;
            --chat--toggle--hover--background: #b8971f;
            --chat--toggle--active--background: #a07f10;
            --chat--toggle--color: #000000;
            --chat--toggle--size: 64px;
        }

        @media (max-width: 768px) {
            :root {
                --chat--toggle--size: 56px;
            }
        }

        @media (max-width: 480px) {
            :root {
                --chat--toggle--size: 52px;
            }
        }

        /* ----- Personalización de la burbuja del chat ----- */
        button[data-key="toggle"],
        .chat-toggle,
        #n8n-chat button[data-key="toggle"] {
            background: linear-gradient(135deg, #D4AF37 0%, #b8971f 100%) !important;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4), 0 0 0 0 rgba(212, 175, 55, 0.7) !important;
            border: 2px solid #000 !important;
            animation: pulse-gold 2s infinite !important;
            transition: all 0.3s ease !important;
        }

        button[data-key="toggle"]:hover,
        .chat-toggle:hover,
        #n8n-chat button[data-key="toggle"]:hover {
            transform: scale(1.1) !important;
            box-shadow: 0 6px 30px rgba(212, 175, 55, 0.6), 0 0 0 8px rgba(212, 175, 55, 0.2) !important;
            background: linear-gradient(135deg, #D4AF37 0%, #b8971f 100%) !important;
        }

        button[data-key="toggle"]:active,
        .chat-toggle:active,
        #n8n-chat button[data-key="toggle"]:active {
            transform: scale(0.95) !important;
        }

        @keyframes pulse-gold {

            0%,
            100% {
                box-shadow: 0 4px 20px rgba(212, 175, 55, 0.4), 0 0 0 0 rgba(212, 175, 55, 0.7);
            }

            50% {
                box-shadow: 0 4px 20px rgba(212, 175, 55, 0.6), 0 0 0 10px rgba(212, 175, 55, 0);
            }
        }

        /* Personalizar el icono dentro de la burbuja */
        [data-key="toggle"] svg {
            filter: brightness(0) invert(1);
            width: 28px !important;
            height: 28px !important;
        }

        [data-key="toggle"]::after {
            content: '�';
            font-size: 30px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        @media (max-width: 768px) {
            [data-key="toggle"] svg {
                width: 24px !important;
                height: 24px !important;
            }

            [data-key="toggle"]::after {
                font-size: 26px;
            }
        }

        @media (max-width: 480px) {
            [data-key="toggle"] svg {
                width: 22px !important;
                height: 22px !important;
            }

            [data-key="toggle"]::after {
                font-size: 24px;
            }
        }

        /* Badge de notificación personalizado */
        .chat-badge {
            background: #ff4444 !important;
            border: 2px solid #000 !important;
            font-weight: bold !important;
        }
    </style>
</head>

<body>

    <header>
        <img src="./img/logo.png" alt="Vigor Barber Logo" width="110" style="margin-bottom:10px; border-radius:50%;">
        <h1>Vigor Barber</h1>
        <p>Gorriti 40, Salta </p>
    </header>

    <div class="info-section">
        <hr class="divider">
        <br>
        <h2>Nuestros Servicios</h2>
        <div class="services-grid">
            <div class="service-item">Corte de Cabello <span>$15.000</span></div>
            <div class="service-item">Corte y Barba <span>$18.000</span></div>
            <div class="service-item">Promo Amigos <span>$25.000</span></div>
            <div class="service-item">Promo del Interior <span>$12.000</span></div>
        </div>
    </div>

    <div class="info-section">
        <h2>Horarios</h2>
        <p>
            Lunes a Sábados: 10:00 a 21:00<br>
            Domingos y Feriados: Cerrado
        </p>
    </div>

    <footer>
        &copy; 2026 Vigor Barber — Gorriti 40, Salta, Argentina
    </footer>

    <!-- Widget de n8n -->
    <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
    <script type="module">
        import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

        function toggleBodyScroll(shouldBlock) {
            if (shouldBlock) {
                document.body.classList.add('modal-open');
            } else {
                document.body.classList.remove('modal-open');
            }
        }

        createChat({
            webhookUrl: 'https://n8ncurso2025-n8n.mos4xj.easypanel.host/webhook/fc178153-fd94-48aa-af13-62bfd9c31d8b/chat',
            webhookConfig: {
                method: 'POST',
                headers: {}
            },
            target: '#n8n-chat',
            mode: 'window',
            chatInputKey: 'chatInput',
            chatSessionKey: 'sessionId',
            metadata: {},
            showWelcomeScreen: false,
            defaultLanguage: 'es',
            initialMessages: [
                'Bienvenido a Vigor Barber.',

            ],
            i18n: {
                es: {
                    title: 'Vigor Barber💈',
                    subtitle: 'Gorriti 40, Salta — Lun a Sáb 10:00 a 21:00',
                    footer: 'Vigor Barber',
                    getStarted: 'Nueva Consulta',
                    inputPlaceholder: 'Escribe tu consulta...',
                },
            },
        });

        setTimeout(() => {
            const chatWrapper = document.querySelector('.chat-wrapper');

            if (chatWrapper) {
                const wrapperObserver = new MutationObserver((mutations) => {
                    mutations.forEach((mutation) => {
                        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                            const isOpen = chatWrapper.classList.contains('open');
                            toggleBodyScroll(isOpen);
                        }
                    });
                });

                wrapperObserver.observe(chatWrapper, {
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
        }, 1000);
    </script>

</body>

</html>
